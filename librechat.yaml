# LibreChat configuration
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
#
# This file is baked into the backend Docker image (`COPY . .` in the Dockerfile)
# and is also bind-mounted by `deploy-compose.yml` at `/app/librechat.yaml`, so the
# running backend picks it up automatically.
#
# Why this file exists:
# The default (native) endpoints — openAI, anthropic, etc. — only appear in
# `/api/endpoints` when their API keys are present AND they are not filtered out by
# the `ENDPOINTS` environment variable. On this deployment only the `agents` endpoint
# was being returned. Endpoints declared under `endpoints.custom` below are NOT subject
# to the `ENDPOINTS` filter, so they are always offered to users (alongside `agents`)
# as long as the referenced API keys are configured on the backend.

# Configuration version (required)
version: 1.3.11

# Cache settings: Set to true to enable caching
cache: true

endpoints:
  custom:
    # OpenAI (direct chat completions)
    - name: 'OpenAI'
      apiKey: '${OPENAI_API_KEY}'
      baseURL: 'https://api.openai.com/v1'
      # Fetch the live model list from the provider; falls back to `default` on failure.
      models:
        default:
          - 'gpt-4o'
          - 'gpt-4o-mini'
          - 'gpt-4.1'
          - 'gpt-4.1-mini'
          - 'gpt-4.1-nano'
          - 'o3-mini'
          - 'o1-mini'
          - 'gpt-4-turbo'
          - 'gpt-3.5-turbo'
        fetch: true
      titleConvo: true
      titleModel: 'gpt-4o-mini'
      modelDisplayLabel: 'OpenAI'

    # Anthropic (via the OpenAI-compatible API surface)
    # https://docs.anthropic.com/en/api/openai-sdk
    - name: 'Anthropic'
      apiKey: '${ANTHROPIC_API_KEY}'
      baseURL: 'https://api.anthropic.com/v1'
      models:
        default:
          - 'claude-3-7-sonnet-latest'
          - 'claude-3-5-sonnet-latest'
          - 'claude-3-5-haiku-latest'
          - 'claude-3-opus-latest'
          - 'claude-3-haiku-20240307'
        # Anthropic's model-list shape differs from OpenAI's; keep a static list.
        fetch: false
      titleConvo: true
      titleModel: 'claude-3-5-haiku-latest'
      modelDisplayLabel: 'Anthropic'
      # Anthropic's OpenAI-compatible layer rejects some OpenAI-only params.
      dropParams:
        - 'stop'
        - 'user'
        - 'frequency_penalty'
        - 'presence_penalty'
