<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="LibreChat - An open source chat application with support for multiple AI models" />
    <title>LibreChat</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        height: 100vh;
      }

      #loading-container .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--loading-spinner-track, rgba(0, 0, 0, 0.12));
        border-top-color: var(--loading-spinner-accent, #0d0d0d);
        border-radius: 50%;
        animation: librechat-spin 0.8s linear infinite;
      }

      #loading-container .loading-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 14px;
        letter-spacing: 0.02em;
        color: var(--loading-text-color, #6b7280);
      }

      @keyframes librechat-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-container .loading-spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let isDark;

      if (theme === 'dark') {
        isDark = true;
      } else if (theme === 'light') {
        isDark = false;
      } else if (theme === 'system') {
        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      } else {
        isDark = false;
      }

      const backgroundColor = isDark ? '#0d0d0d' : '#ffffff';
      const spinnerTrack = isDark ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.12)';
      const spinnerAccent = isDark ? '#ffffff' : '#0d0d0d';
      const loadingTextColor = isDark ? '#9ca3af' : '#6b7280';

      loadingContainerStyle.innerHTML = `
        #loading-container {
          background-color: ${backgroundColor};
          --loading-spinner-track: ${spinnerTrack};
          --loading-spinner-accent: ${spinnerAccent};
          --loading-text-color: ${loadingTextColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container">
        <div class="loading-spinner" role="status" aria-label="Loading LibreChat"></div>
        <div class="loading-text">Loading LibreChat…</div>
      </div>
    </div>
  </body>
</html>
